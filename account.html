<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOH 2025 - account</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- GitHub Pages - development only -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 64px;
        }
        .modal {
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        #main-content-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-firestore.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body class="bg-gray-100">
    <div id="header-placeholder"></div>
    <div id="left-menu-placeholder"></div>
    <div id="header-notification-root"></div>
    <div id="authentication-root"></div>

    <div id="main-content-area">
        <div id="root"></div>
    </div>

    <!-- 🔥 VŠETKY SKRIPTY NAČÍTAME AKO MODULY -->
    <script type="module">
        // Načítanie authentication.js ako modulu
        import './authentication.js';
    </script>
    
    <script type="module">
        // Počkáme na inicializáciu Firebase a potom načítame header a account
        import './header.js';
        import './account.js';
        
        // Funkcia na získanie URL parametrov
        function getUrlParams() {
            const params = {};
            window.location.search.substring(1).split('&').forEach(param => {
                const [key, value] = param.split('=');
                params[key] = decodeURIComponent(value);
            });
            return params;
        }

        // Čakáme na inicializáciu Firebase z authentication.js
        const waitForFirebase = () => {
            return new Promise((resolve) => {
                if (window.auth && window.db) {
                    console.log("account.html: Firebase už je inicializovaný.");
                    resolve();
                    return;
                }

                const handleDbInitialized = () => {
                    console.log("account.html: Zachytená udalosť dbInitialized.");
                    window.removeEventListener('dbInitialized', handleDbInitialized);
                    resolve();
                };

                window.addEventListener('dbInitialized', handleDbInitialized);
                
                setTimeout(() => {
                    console.warn("account.html: Timeout čakania na Firebase inicializáciu...");
                    window.removeEventListener('dbInitialized', handleDbInitialized);
                    
                    if (window.auth && window.db) {
                        console.log("account.html: Firebase nájdený po timeoute.");
                        resolve();
                    } else {
                        console.error("account.html: Firebase sa nepodarilo inicializovať.");
                        resolve();
                    }
                }, 5000);
            });
        };

        // Spustenie aplikácie
        document.addEventListener('DOMContentLoaded', async () => {
            console.log("account.html: DOMContentLoaded - čakám na Firebase...");
            
            await waitForFirebase();
            
            console.log("account.html: Firebase je pripravený. Spúšťam aplikáciu.");
            
            if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
                console.error("Chyba: React alebo ReactDOM nie sú načítané.");
                document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 20px;">Chyba pri načítaní aplikácie.</div>';
                return;
            }
            
            if (typeof ResetPasswordApp === 'undefined') {
                console.error("Chyba: Komponent ResetPasswordApp nie je definovaný.");
                document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 20px;">Chyba pri načítaní komponentu aplikácie.</div>';
                return;
            }

            if (!window.auth) {
                console.error("Chyba: Firebase Auth nie je inicializovaný.");
                document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 20px;">Chyba pri inicializácii autentifikácie.</div>';
                return;
            }

            const params = getUrlParams();
            const mode = params.mode;
            const titleElement = document.querySelector('title');

            if (titleElement) {
                if (mode === 'verifyAndChangeEmail') {
                    titleElement.textContent = 'SOH 2025 - Potvrdenie e-mailovej adresy';
                } else if (mode === 'resetPassword') {
                    titleElement.textContent = 'SOH 2025 - Reset hesla';
                } else if (mode === 'recoverEmail') {
                    titleElement.textContent = 'SOH 2025 - Obnovenie e-mailovej adresy';
                } else {
                    titleElement.textContent = 'SOH 2025 - account';
                }
            }

            try {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(ResetPasswordApp, null));
                console.log("account.html: React App vykreslená.");
            } catch (error) {
                console.error("Chyba pri vykresľovaní React aplikácie:", error);
                document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 20px;">Chyba pri vykresľovaní aplikácie.</div>';
            }
        });
    </script>
</body>
</html>
