<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOH 2025 - account</title> <!-- Toto bude dynamicky zmenené JS -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- GitHub Pages - development only -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            /* ZMENA: Nastavenie body na flexbox pre centrovanie */
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Zabezpečí, že body zaberá celú výšku viewportu */
            padding-top: 64px; /* Odsadenie pre pevnú hlavičku */
        }
        /* Základné štýly pre modálne okno, ak by sa použilo */
        .modal {
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        /* ZMENA: Centrovanie obsahu v main-content-area */
        #main-content-area {
            flex-grow: 1;
            display: flex;
            justify-content: center; /* Horizontálne centrovanie */
            align-items: center;   /* Vertikálne centrovanie */
            padding: 1rem;
        }
    </style>
    <!-- Firebase SDKs - ZMENA: Používame verziu 7.24.0 -->
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-firestore.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- 🔥 ODSTRÁNENÁ priama Firebase konfigurácia - teraz sa načíta z authentication.js -->
</head>
<body class="bg-gray-100">
    <!-- Hlavička a ľavé menu budú načítané dynamicky alebo sú súčasťou iných komponentov -->
    <div id="header-placeholder"></div>
    <div id="left-menu-placeholder"></div>

    <!-- NOVINKA: Element pre globálne notifikácie z header.js -->
    <div id="header-notification-root"></div>
    <div id="authentication-root"></div>


    <div id="main-content-area"> <!-- Odstránené flex-1 p-4, presunuté do style -->
        <div id="root">
            <!-- React aplikácia sa vykreslí tu -->
        </div>
    </div>

    <!-- Načítanie skriptov - DÔLEŽITÉ PORADIE! -->
    <script src="clear-console.js"></script>
    <script src="authentication.js"></script>  <!-- 🔥 NAJPRV authentication.js, ktorý inicializuje Firebase -->
    <script src="header.js"></script>
    <script src="account.js"></script>

    <script>
        // Funkcia na získanie URL parametrov pre dynamický názov karty
        function getUrlParams() {
            const params = {};
            window.location.search.substring(1).split('&').forEach(param => {
                const [key, value] = param.split('=');
                params[key] = decodeURIComponent(value);
            });
            return params;
        }

        // 🔥 Čakáme na inicializáciu Firebase z authentication.js
        // Používame event 'dbInitialized', ktorý je odoslaný v setupFirebase()
        const waitForFirebase = () => {
            return new Promise((resolve) => {
                // Ak už je Firebase inicializovaný, okamžite vyriešime
                if (window.auth && window.db) {
                    console.log("account.html: Firebase už je inicializovaný.");
                    resolve();
                    return;
                }

                // Inak počkáme na udalosť
                const handleDbInitialized = () => {
                    console.log("account.html: Zachytená udalosť dbInitialized.");
                    window.removeEventListener('dbInitialized', handleDbInitialized);
                    resolve();
                };

                window.addEventListener('dbInitialized', handleDbInitialized);
                
                // Timeout pre prípad, že by sa udalosť neodoslala
                setTimeout(() => {
                    console.warn("account.html: Timeout čakania na Firebase inicializáciu. Kontrolujem window.auth a window.db...");
                    window.removeEventListener('dbInitialized', handleDbInitialized);
                    
                    // Posledná kontrola
                    if (window.auth && window.db) {
                        console.log("account.html: Firebase nájdený po timeoute.");
                        resolve();
                    } else {
                        console.error("account.html: Firebase sa nepodarilo inicializovať ani po timeoute.");
                        // Aj tak vyriešime, aby sme zobrazili chybovú hlášku
                        resolve();
                    }
                }, 5000); // 5 sekúnd timeout
            });
        };

        // Spustíme vykreslenie React aplikácie po načítaní DOM a inicializácii Firebase
        document.addEventListener('DOMContentLoaded', async () => {
            console.log("account.html: DOMContentLoaded - čakám na Firebase...");
            
            // 🔥 Počkáme na inicializáciu Firebase
            await waitForFirebase();
            
            console.log("account.html: Firebase je pripravený. Spúšťam aplikáciu.");
            
            // Skontrolujeme, či sú React a ReactDOM načítané
            if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
                console.error("Chyba: React alebo ReactDOM nie sú načítané. Skontrolujte poradie skriptov.");
                document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 20px;">Chyba pri načítaní aplikácie. Skúste to prosím neskôr.</div>';
                return;
            }
            
            // Zabezpečíme, že ResetPasswordApp je definovaná (je v account.js)
            if (typeof ResetPasswordApp === 'undefined') {
                console.error("Chyba: Komponent ResetPasswordApp nie je definovaný. Skontrolujte account.js.");
                document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 20px;">Chyba pri načítaní komponentu aplikácie.</div>';
                return;
            }

            // Kontrola, či je Firebase inicializovaný
            if (!window.auth) {
                console.error("Chyba: Firebase Auth nie je inicializovaný. Skontrolujte authentication.js.");
                document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 20px;">Chyba pri inicializácii autentifikácie. Skúste to prosím neskôr.</div>';
                return;
            }

            // Dynamická zmena názvu karty
            const params = getUrlParams();
            const mode = params.mode;
            const titleElement = document.querySelector('title');

            if (titleElement) {
                if (mode === 'verifyAndChangeEmail') {
                    titleElement.textContent = 'SOH 2025 - Potvrdenie e-mailovej adresy';
                } else if (mode === 'resetPassword') {
                    titleElement.textContent = 'SOH 2025 - Reset hesla';
                } else if (mode === 'recoverEmail') {
                    titleElement.textContent = 'SOH 2025 - Obnovenie e-mailovej adresy';
                } else {
                    titleElement.textContent = 'SOH 2025 - account'; // Predvolený názov
                }
            }

            try {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(ResetPasswordApp, null));
                console.log("account.html: React App vykreslená.");
            } catch (error) {
                console.error("Chyba pri vykresľovaní React aplikácie:", error);
                document.getElementById('root').innerHTML = '<div style="color: red; text-align: center; padding: 20px;">Chyba pri vykresľovaní aplikácie. Skúste to prosím neskôr.</div>';
            }
        });
    </script>
</body>
</html>
